<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Trip Planner</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00A896">

    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&family=Teko:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="app-shell">
        <header class="app-header">
            <h1 id="header-title">Dashboard</h1>
            <div class="header-actions">
                <button id="trips-toggle-btn" class="trips-toggle-btn" title="Schimbă călătoria">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M21 3L3 10.53v.98l6.84 2.65L12.48 21h.98L21 3z"/></svg>
                    <span id="active-trip-chip" class="active-trip-chip"></span>
                </button>
            </div>
        </header>

        <main class="app-main">
            <!-- ECRAN 1: DASHBOARD -->
            <div id="dashboard-screen" class="screen active">
                <!-- Content generated by JS -->
            </div>

            <!-- ECRAN 2: BUGET -->
            <div id="budget-screen" class="screen">
                <!-- Content generated by JS -->
            </div>

            <!-- ECRAN 3: LOCAȚII -->
            <div id="map-screen" class="screen">
                <div id="location-list-container" class="location-list">
                    <!-- Cards generated by JS -->
                </div>
                <button id="add-location-btn" class="btn-fab" title="Adaugă locație">+</button>
            </div>

            <!-- ECRAN 4: ITINERAR -->
            <div id="itinerary-screen" class="screen">
                <!-- Content generated by JS -->
            </div>

            <!-- ECRAN 5: CHECKLIST -->
            <div id="checklist-screen" class="screen">
                <!-- Content generated by JS -->
            </div>
        </main>

        <nav class="app-nav">
            <button data-screen="dashboard-screen" data-title="Dashboard" class="nav-button active">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                <span>Dashboard</span>
            </button>
            <button data-screen="budget-screen" data-title="Buget" class="nav-button">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4c-1.11 0-1.99.89-1.99 2L2 18c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2zm0 14H4V8h16v10zm-10-8H6v2h4v-2z"/></svg>
                <span>Buget</span>
            </button>
            <button data-screen="map-screen" data-title="Locații" class="nav-button">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                <span>Locații</span>
            </button>
            <button data-screen="itinerary-screen" data-title="Itinerar" class="nav-button">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7v-5z"/>
                </svg>
                <span>Itinerar</span>
            </button>
            <button data-screen="checklist-screen" data-title="Checklist" class="nav-button">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
                <span>Checklist</span>
            </button>
        </nav>
    </div>

    <!-- ================================================ -->
    <!-- TRIPS OVERLAY                                    -->
    <!-- ================================================ -->
    <div id="trips-overlay" class="trips-overlay" aria-hidden="true">
        <div class="trips-overlay-backdrop"></div>
        <div class="trips-overlay-panel">
            <div class="trips-overlay-header">
                <h2>Călătoriile mele</h2>
                <button id="trips-overlay-close" class="icon-btn" aria-label="Închide">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
                </button>
            </div>
            <div id="trips-list" class="trips-list"></div>
            <div class="trips-overlay-footer">
                <button id="import-trip-btn" class="btn-secondary">⬆️ Import JSON</button>
                <button id="new-trip-btn" class="btn-primary">+ Călătorie nouă</button>
                <input type="file" id="import-file-input" accept=".json" style="display:none">
            </div>
        </div>
    </div>

    <!-- ================================================ -->
    <!-- TRIP FORM MODAL (New / Edit Trip)                -->
    <!-- ================================================ -->
    <div id="trip-form-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="modal-close-button" id="trip-form-close">×</button>
            <h2 id="trip-form-title">Călătorie nouă</h2>
            <div class="form-group">
                <label for="trip-form-name">Nume călătorie</label>
                <input type="text" id="trip-form-name" class="form-input" placeholder="Ex: Aventura Islanda 2025">
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="trip-form-start">Data start</label>
                    <input type="date" id="trip-form-start" class="form-input">
                </div>
                <div class="form-group">
                    <label for="trip-form-end">Data final</label>
                    <input type="date" id="trip-form-end" class="form-input">
                </div>
            </div>
            <div class="form-group">
                <label for="trip-form-travelers">Nr. persoane</label>
                <input type="number" id="trip-form-travelers" class="form-input" min="1" value="1">
            </div>
            <input type="hidden" id="trip-form-id">
            <div class="form-actions">
                <button id="trip-form-save" class="btn-primary btn-full">Salvează</button>
            </div>
        </div>
    </div>

    <!-- ================================================ -->
    <!-- LOCATION EDIT MODAL                              -->
    <!-- ================================================ -->
    <div id="location-edit-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="modal-close-button" id="loc-edit-close">×</button>
            <h2 id="loc-edit-title">Adaugă locație</h2>
            <div class="form-group">
                <label for="loc-edit-name">Nume</label>
                <input type="text" id="loc-edit-name" class="form-input" placeholder="Landmannalaugar">
            </div>
            <div class="form-group">
                <label for="loc-edit-description">Descriere</label>
                <textarea id="loc-edit-description" class="form-input form-textarea" rows="3"></textarea>
            </div>
            <div class="form-group">
                <label for="loc-edit-difficulty">Dificultate</label>
                <input type="text" id="loc-edit-difficulty" class="form-input" placeholder="Drumeție Medie / Off-road">
            </div>
            <div class="form-group">
                <label for="loc-edit-tips">Sfaturi</label>
                <textarea id="loc-edit-tips" class="form-input form-textarea" rows="2"></textarea>
            </div>
            <div class="form-group">
                <label for="loc-edit-images">URL-uri imagini (câte unul pe rând)</label>
                <textarea id="loc-edit-images" class="form-input form-textarea" rows="3" placeholder="images/photo1.jpg&#10;https://example.com/photo2.jpg"></textarea>
            </div>
            <div class="form-group">
                <label for="loc-edit-coordinates">Coordonate (lat,lng)</label>
                <input type="text" id="loc-edit-coordinates" class="form-input" placeholder="63.9909,-19.0629">
            </div>
            <div class="form-group">
                <label for="loc-edit-mapurl">Google Maps Embed URL</label>
                <input type="text" id="loc-edit-mapurl" class="form-input" placeholder="https://www.google.com/maps/embed?pb=...">
            </div>
            <input type="hidden" id="loc-edit-id">
            <div class="form-actions">
                <button id="loc-edit-save" class="btn-primary btn-full">Salvează locația</button>
            </div>
        </div>
    </div>

    <!-- ================================================ -->
    <!-- LOCATION DETAIL MODAL                            -->
    <!-- ================================================ -->
    <div id="location-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="modal-close-button" id="loc-detail-close">×</button>
            <h2 id="modal-location-name">Nume Locație</h2>

            <div id="modal-carousel" class="carousel">
                <div class="carousel-slides"></div>
                <button class="carousel-button prev" aria-label="Previous slide">❮</button>
                <button class="carousel-button next" aria-label="Next slide">❯</button>
                <div class="carousel-dots"></div>
            </div>

            <div class="modal-info-section">
                <h3>Detalii Aventură</h3>
                <p><strong>Dificultate:</strong> <span id="modal-location-difficulty">N/A</span></p>
                <p><strong>Locație:</strong> <a id="modal-location-gmaps-link" href="#" target="_blank" rel="noopener noreferrer">Deschide în Google Maps</a></p>
            </div>

            <div class="modal-info-section">
                <h3>Descriere</h3>
                <p id="modal-location-description">Descriere detaliată a locației...</p>
            </div>

            <div class="modal-info-section">
                <h3>Sfaturi Foto &amp; Utile</h3>
                <p id="modal-location-tips">N/A</p>
            </div>

            <div class="modal-map-container">
                <iframe
                    id="modal-map-iframe"
                    src=""
                    width="100%"
                    height="300"
                    style="border:0;"
                    allowfullscreen=""
                    loading="lazy"
                    referrerpolicy="no-referrer-when-downgrade">
                </iframe>
            </div>
        </div>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="toast" aria-live="polite"></div>

    <script src="storage.js"></script>
    <script src="script.js"></script>
</body>
</html>
